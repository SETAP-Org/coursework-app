<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GCMS | User Dashboard</title>

        <link rel="stylesheet" href="../css/user_dash.css"/>

        <link id="theme-stylesheet" rel="stylesheet" href="../css/root-dark.css" />
        <script src="../scripts/L&D-mode.js" defer></script>
        <script defer>
        if(!getCookie('theme')) {
            setCookie('theme', 'dark');
        }
        setTheme();
        </script>
        
        <script src="../scripts/injectHeader.js" defer></script>
        <script src="../scripts/injectFooter.js" defer></script>

        <link rel="icon" href="../assets/favicon.png" type="image/png">


    </head>
    <body>
    <header id="site-header"></header>

        <div class="title">
        <h1>Welcome, <span id="user-name">Loading...</span></h1>
        </div>

        <section class="projects-outer-container">
            <div class="projects-inner-container">
                <ul class="projects-list">
                    <script defer>
                    for (let i = 0; i < 5; i++) {
                        document.write(`<li class="project-list-item">Project ${i + 1}</li>`);
                    }
                    </script>
                </ul>
            </div>
        </section>
        <footer id="site-footer"></footer>
        
    </body>
</html>
