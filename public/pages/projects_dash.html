

  <!doctype html>
  <html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link id="theme-stylesheet" rel="stylesheet" href="../css/root-dark.css" />
  <script src="../scripts/L&D-mode.js"></script>
  <script>
  if(!getCookie('theme')) {
    setCookie('theme', 'dark');
  }
  setTheme();
  </script>

  <link rel="stylesheet" href="../css/projects_dash.css" />
  <link rel="stylesheet" href="../css/konva.css" />

  <script src="../scripts/header.js" defer></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <script src="../scripts/dash-konva.js" defer></script>

  <link rel="icon" href="../assets/favicon.png" type="image/png">

  <title>GCMS | Project Dashboard</title>
</head>
  <body>
    <div class="Dashboard">
  <!-- Include the header component -->
    <header id="site-header"></header>

      <main class="Dashboard-content">

        <section class="Dashboard-container">
          <div class="card">
            <h1 class="Dashboard-title">Main Content Area</h1>
            <p class="Dashboard-text">UNI type shit</p>
          </div>
          <div class="button_bar">
          <!--<button class="remove_button" id="note-trigger">Edit Note Display</button>-->
          </div> 
          <div class="konva-wrapper">
            <div id = "Konva-container"></div> 
            <div class="delete-zone">Drop Here to Delete</div>
            <button class="add-note-btn" id="add-note-btn">Add Note</button>
          </div> 
        </section>

        <aside class="Dashboard-right" >
          <section class="card small-box">
            <h2 class="Dashboard-text">Deadline</h2>
          </section>

          <section class="card small-box">
            <h2 class="Dashboard-text">Calandar </h2>
          </section>
        </aside>
        </main>
      <footer id="site-footer"></footer>
    </div>
  </body>
  </html>
