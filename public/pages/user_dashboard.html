<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Dashboard</title>

        <link rel="stylesheet" href="../css/project-dash.css"/>
        <link rel="stylesheet" href="../css/styles.css" />
        <link rel="stylesheet" href="../css/user_dashboard.css"/>
        <link rel="stylesheet" href="../css/header_style.css"/>
        
        <script type="module" src="/scripts/user_dashboard.js"></script>
        <script src="../scripts/header.js"></script>
        <script src="../scripts/footer.js"></script>

    </head>
    <body>
    <header id="site-header"></header>

        <div class="title">
        <h1>Welcome, <span id="user-name">Loading...</span></h1>
        </div>

        <section class="projects-outer-container">
            <div class="projects-inner-container">
                <ul class="projects-list">
                    <script>
                    for (let i = 0; i < 5; i++) {
                        document.write(`<li class="project-list-item">Project ${i + 1}</li>`);
                    }
                    </script>
                </ul>
            </div>
        </section>
        <footer id="site-footer"></footer>
        
    </body>
</html>
